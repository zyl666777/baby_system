spring.application.name=baby-symptom-api
server.port=8080

# ---------- 資料庫 ----------
# 開發用 H2，資料存在專案資料夾的 data/ 裡，重開不會消失
spring.datasource.url=jdbc:h2:file:./data/baby-symptom;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
# 資料表由 Flyway 建立（db/migration），Hibernate 不自動改資料表
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# H2 主控台：http://localhost:8080/h2-console（只有登入的管理員能開）
# JDBC URL 填 jdbc:h2:file:./data/baby-symptom;MODE=PostgreSQL，帳號 sa，密碼空白
spring.h2.console.enabled=true

# ---------- 管理員帳號 ----------
# 密碼請用環境變數 ADMIN_PASSWORD 設定，不要把真的密碼寫在這裡
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:change-me}

# ---------- 前端網址（CORS）----------
# 3D 前端（Vite）可以讀取公開 API；上線時改成正式網域
app.cors.allowed-origins=http://localhost:5173

# ---------- 改用 PostgreSQL 時 ----------
# spring.datasource.url=jdbc:postgresql://localhost:5432/babysymptom
# spring.datasource.username=${DB_USER}
# spring.datasource.password=${DB_PASSWORD}
# spring.h2.console.enabled=false

# 一次抓多筆徵兆，避免 N+1 查詢
spring.jpa.properties.hibernate.default_batch_fetch_size=50
