# 推送到 main 分支時，自動打包 3D 頁面並發布到 GitHub Pages
name: 發布 3D 頁面到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'baby-symptom-3d/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:   # 也可以在 Actions 頁面手動執行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baby-symptom-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: baby-symptom-3d/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: baby-symptom-3d/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
